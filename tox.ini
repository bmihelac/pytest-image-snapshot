# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py38,py39,py310,py311,py312,pypy3,ruff

[testenv]
deps = pytest>=3.0
commands = pytest {posargs:tests}

[testenv:ruff]
skip_install = true
deps = ruff
commands = ruff check pytest_image_snapshot.py tests

[gh]
python =
    3.12 = py312
    3.11 = py311, ruff
    3.10 = py310
    3.9 = py39
    3.8 = py38
    pypy3 = pypy3
